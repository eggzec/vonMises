name: Windows Build and Test

on:
  push:
    branches:
      - master
      - Fix-build
      - Fix-ci/cd-pipeline
      - Fix-unittest
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        # setup-miniconda requires a login shell so that `conda activate`
        # works; -e makes a failing command fail the step.
        shell: bash -el {0}

    steps:
    - uses: actions/checkout@v4

    # setup-miniconda creates the environment from environment.yml and
    # activates it for every subsequent step, so the previous
    # `conda env create` + per-step `conda activate` pair is no longer
    # needed (and `conda activate` does not persist across `run:` blocks).
    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        environment-file: environment.yml
        activate-environment: vm
        auto-activate-base: false

    # setup.py forces the "MinGW Makefiles" CMake generator on Windows, but
    # environment.yml installs no compiler, so the build had nothing to
    # compile with. m2w64-toolchain provides gcc/g++ and mingw32-make.
    - name: Install MinGW toolchain
      run: conda install -y -c conda-forge m2w64-toolchain

    - name: Build
      run: |
        python build.py install
        vonMises -m test/test-data/MATRIX.mat -k A > vonMises.log 2>&1

    - name: Unittest
      run: |
        pytest -s . > test.log 2>&1

    - name: Code Lint
      run: |
        ruff version
        ruff format --check .
        ruff check --output-format=github .

    - name: Archive Logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-logs-windows
        path: |
          build.log
          vonMises.log
          test.log
        if-no-files-found: ignore
