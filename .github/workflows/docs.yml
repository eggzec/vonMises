name: Build and Deploy Docs

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  workflow_dispatch:

# Pages is configured with build_type "workflow", so the site is uploaded as
# an artifact and deployed by actions/deploy-pages. Nothing is pushed to a
# branch, and the token never needs write access to the repository contents.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      # --only-group keeps the project itself out of the environment; docs do
      # not need the compiled extension, so the runner skips the CMake build.
      - name: Install docs dependencies
        run: uv sync --only-group docs

      - name: Build Zensical site
        run: uv run --no-sync zensical build --clean

      - name: Upload Pages Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
