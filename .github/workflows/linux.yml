name: Linux Build and Test

on:
  push:
    branches:
      - master
      - Fix-build
      - Fix-ci/cd-pipeline
      - Fix-unittest
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # setup-miniconda requires a login shell so that `conda activate`
        # works; -e makes a failing command fail the step.
        shell: bash -el {0}

    steps:
    - uses: actions/checkout@v4

    # Previously the workflow called `conda env create` directly and relied
    # on conda already being on PATH, which is not guaranteed on the runner.
    # setup-miniconda provisions conda, creates the environment from
    # environment.yml and activates it for every subsequent step.
    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        environment-file: environment.yml
        activate-environment: vm
        auto-activate-base: false

    - name: Build
      run: |
        python build.py install
        vonMises -m test/test-data/MATRIX.mat -k A > vonMises.log 2>&1

    - name: Unittest
      run: |
        pytest -s . > test.log 2>&1

    - name: Code Lint
      run: |
        ruff version
        ruff format --check .
        ruff check --output-format=github .

    - name: Archive Logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-logs-linux
        path: |
          build.log
          vonMises.log
          test.log
        if-no-files-found: ignore
